openapi: 3.2.0
info:
  title: Hearthstone Game Data Decks API
  description: Battle.net Game Data API for Hearthstone providing access to card sets, individual cards, card backs, card decks (deck codes), and metadata such as classes, sets, rarities, types, and game modes. Requires an OAuth 2.0 client credentials access token from https://oauth.battle.net.
  version: '1.0'
  contact:
    name: Battle.net Developer Portal
    url: https://develop.battle.net/
servers:
- url: https://us.api.blizzard.com
  description: US regional host
- url: https://eu.api.blizzard.com
  description: EU regional host
security:
- bearerAuth: []
tags:
- name: Decks
  description: Decode Hearthstone deck codes.
paths:
  /hearthstone/deck:
    get:
      operationId: getDeck
      summary: Get Deck
      description: Returns the deck represented by a Hearthstone deck code.
      tags:
      - Decks
      parameters:
      - name: code
        in: query
        required: true
        description: Hearthstone deck code.
        schema:
          type: string
      - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Deck returned.
components:
  parameters:
    Locale:
      name: locale
      in: query
      required: false
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
