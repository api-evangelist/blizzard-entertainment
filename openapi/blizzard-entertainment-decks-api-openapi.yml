openapi: 3.1.0
info:
  title: Diablo III Community Achievements Decks API
  description: Battle.net Community and Game Data API for Diablo III providing access to acts, artisans, recipes, followers, character classes, items, item types, and player profile data. Requires an OAuth 2.0 client credentials access token from https://oauth.battle.net.
  version: '1.0'
  contact:
    name: Battle.net Developer Portal
    url: https://develop.battle.net/
servers:
- url: https://us.api.blizzard.com
  description: US regional host
- url: https://eu.api.blizzard.com
  description: EU regional host
security:
- bearerAuth: []
tags:
- name: Decks
  description: Decode Hearthstone deck codes.
paths:
  /hearthstone/deck:
    get:
      operationId: getDeck
      summary: Get Deck
      description: Returns the deck represented by a Hearthstone deck code.
      tags:
      - Decks
      parameters:
      - name: code
        in: query
        required: true
        description: Hearthstone deck code.
        schema:
          type: string
      - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Deck returned.
components:
  parameters:
    Locale:
      name: locale
      in: query
      required: false
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
