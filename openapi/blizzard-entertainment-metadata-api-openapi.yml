openapi: 3.2.0
info:
  title: Hearthstone Game Data Metadata API
  description: Battle.net Game Data API for Hearthstone providing access to card sets, individual cards, card backs, card decks (deck codes), and metadata such as classes, sets, rarities, types, and game modes. Requires an OAuth 2.0 client credentials access token from https://oauth.battle.net.
  version: '1.0'
  contact:
    name: Battle.net Developer Portal
    url: https://develop.battle.net/
servers:
- url: https://us.api.blizzard.com
  description: US regional host
- url: https://eu.api.blizzard.com
  description: EU regional host
security:
- bearerAuth: []
tags:
- name: Metadata
  description: Retrieve Hearthstone metadata reference data.
paths:
  /hearthstone/metadata:
    get:
      operationId: getMetadata
      summary: Get Metadata
      description: Returns Hearthstone metadata reference data (sets, classes, etc.).
      tags:
      - Metadata
      parameters:
      - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Metadata returned.
components:
  parameters:
    Locale:
      name: locale
      in: query
      required: false
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
