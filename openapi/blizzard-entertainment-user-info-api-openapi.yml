openapi: 3.2.0
info:
  title: Battle.net OAuth User Info API
  description: OAuth 2.0 authorization server for the Battle.net developer platform. Supports the authorization code flow (with PKCE) for user-context access to Battle.net account and profile scopes, and the client credentials flow for accessing public Game Data APIs. Hosted at https://oauth.battle.net.
  version: '1.0'
  contact:
    name: Battle.net Developer Portal
    url: https://develop.battle.net/
servers:
- url: https://oauth.battle.net
  description: Battle.net OAuth host
tags:
- name: User Info
  description: OpenID Connect userinfo endpoint.
paths:
  /oauth/userinfo:
    get:
      operationId: getUserInfo
      summary: Get User Info
      description: Returns the Battle.net account id, battletag, and sub claim for the authenticated user.
      tags:
      - User Info
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User info returned.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
